<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>10 인터랙티브 학습용 동영상 플레이어</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style id="appStyle">
  /* ---------- Soft UI 토큰: 밝은 회색 단색 바탕 + 돌출 카드 + 파란 강조색 하나 ---------- */
  :root {
    --bg: #ececeb; --face: #f1f1f0; --sunk: #e4e4e3;
    --ink: #1d1d1f; --mute: #77777d; --accent: 47,123,246;
    --ok: 63,156,90; --ng: 208,84,74;
    /* 돌출: 위 하이라이트 + 아래 부드러운 그림자 */
    --raise: 0 10px 18px -8px rgba(0,0,0,.2), 0 3px 0 -1px rgba(0,0,0,.06), inset 0 1px 0 #fff, inset 0 -2px 0 rgba(0,0,0,.05);
    --raise-sm: 0 6px 10px -6px rgba(0,0,0,.22), 0 2px 0 -1px rgba(0,0,0,.06), inset 0 1px 0 #fff, inset 0 -1.5px 0 rgba(0,0,0,.05);
    /* 눌림: 안쪽 그림자 */
    --press: inset 0 2px 5px rgba(0,0,0,.14), inset 0 -1px 0 rgba(255,255,255,.9);
    --focus: 0 0 0 2px var(--bg), 0 0 0 4px rgba(var(--accent),1);
  }
  html { -webkit-text-size-adjust: 100%; }
  body { background: var(--bg); color: var(--ink); }
  .glass { background: var(--face); border: 1px solid rgba(0,0,0,.04); box-shadow: var(--raise); }
  .glass-chip { background: var(--face); border: 1px solid rgba(0,0,0,.05); box-shadow: var(--raise-sm); }
  .glass-ok { background: rgba(var(--ok),.1); border: 1.5px solid rgba(var(--ok),.45); color: #2a6b3d; }
  .glass-ng { background: rgba(var(--ng),.09); border: 1.5px solid rgba(var(--ng),.45); color: #9a3027; }
  .glass-info { background: var(--sunk); box-shadow: var(--press); color: #5e5e64; }
  .sunk { background: var(--sunk); box-shadow: var(--press); }
  /* 섹션 머리: 음각 구분선 */
  .sec-head { display: flex; align-items: center; gap: .5rem; padding-bottom: .6rem; border-bottom: 1px solid rgba(0,0,0,.09);
    box-shadow: 0 1px 0 #fff; font-family: Inter, 'Noto Sans KR', sans-serif; font-weight: 600; font-size: .8rem; letter-spacing: .04em; min-width: 0; }
  .sec-head small { font-family: 'Noto Sans KR'; font-weight: 500; letter-spacing: 0; color: var(--mute); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sec-toggle { cursor: pointer; color: var(--ink); white-space: nowrap; }
  .sec-toggle[aria-expanded="false"] small { display: none; }
  .sec-toggle:focus-visible { outline: none; box-shadow: 0 1px 0 #fff, var(--focus); border-radius: .5rem; }
  .sec-sum { display: none; font-family: 'Noto Sans KR'; font-size: 11px; font-weight: 500; letter-spacing: 0; color: var(--mute);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .sec-toggle[aria-expanded="false"] .sec-sum { display: block; }
  .chev { flex: none; width: 1.6rem; height: 1.6rem; border-radius: 9999px; display: grid; place-items: center; background: var(--face); box-shadow: var(--raise-sm); }
  .chev::before { content: ''; width: .45rem; height: .45rem; border-right: 1.6px solid var(--ink); border-bottom: 1.6px solid var(--ink);
    transform: translateY(-2px) rotate(45deg); transition: transform .2s; }
  .sec-toggle[aria-expanded="false"] .chev::before { transform: translateX(-1px) rotate(-45deg); }
  .sec-toggle:active .chev { box-shadow: var(--press); }
  /* 버튼: 둥근 pill · Hover 진해짐 · Pressed 눌림 · Disabled 평평 */
  .pill { display: inline-flex; align-items: center; justify-content: center; gap: .4rem; border-radius: 9999px; font-weight: 500; color: var(--ink);
    background: var(--face); border: 1px solid rgba(0,0,0,.05); box-shadow: var(--raise-sm); transition: background .15s, box-shadow .15s, transform .1s; cursor: pointer; }
  .pill:hover:not(:disabled) { background: #f6f6f5; }
  .pill:active:not(:disabled) { box-shadow: var(--press); background: var(--sunk); transform: translateY(1px); }
  .pill:disabled { opacity: .55; box-shadow: none; cursor: not-allowed; }
  .pill-dark { color: #fff; border-color: rgba(0,0,0,.08);
    background: linear-gradient(180deg, rgb(160,160,167), rgb(136,136,143)); text-shadow: 0 1px 0 rgba(0,0,0,.15);
    box-shadow: 0 10px 18px -8px rgba(0,0,0,.3), 0 3px 0 -1px rgba(0,0,0,.12), inset 0 1px 0 rgba(255,255,255,.45), inset 0 -2px 0 rgba(0,0,0,.08); }
  .pill-dark:hover:not(:disabled) { background: linear-gradient(180deg, rgb(132,132,140), rgb(108,108,116)); }
  .pill-dark:active:not(:disabled) { background: var(--sunk); color: var(--ink); text-shadow: none; box-shadow: var(--press); }
  .pill-dark:disabled { background: var(--sunk); color: var(--mute); text-shadow: none; }
  .pill.on { background: var(--sunk); box-shadow: var(--press); font-weight: 600; }
  .pill-danger:hover:not(:disabled) { color: rgb(var(--ng)); }
  /* 포커스 링: 키보드 이동 시 항상 파란 링 */
  :focus-visible { outline: none; }
  .pill:focus-visible, .step:focus-visible, .tab-btn:focus-visible, .switch:focus-visible, .tchip:focus-visible, .cue:focus-visible,
  .icon-btn:focus-visible, .bar:focus-visible, a:focus-visible, .mk:focus-visible { box-shadow: var(--focus) !important; }
  .pill:has(input:focus-visible) { box-shadow: var(--focus); }
  /* 선택 칩 */
  .chip input:checked + span { background: linear-gradient(180deg, rgb(160,160,167), rgb(136,136,143)); color: #fff; font-weight: 600; border-color: rgba(0,0,0,.08);
    box-shadow: inset 0 2px 4px rgba(0,0,0,.18), inset 0 -1px 0 rgba(255,255,255,.25); }
  .chip:hover input:not(:checked) + span { background: #f6f6f5; }
  .chip input:focus-visible + span { box-shadow: var(--focus); }
  /* 세그먼트 탭 */
  [role="tablist"].glass { background: var(--sunk); box-shadow: var(--press); border-color: transparent; }
  .tab-btn { color: var(--mute); border-radius: 9999px; transition: background .15s, color .15s, box-shadow .15s; white-space: nowrap; }
  .tab-btn:hover { color: var(--ink); }
  .tab-btn[aria-selected="true"] { background: var(--face); color: var(--ink); box-shadow: var(--raise-sm); }
  .drop.dragging { box-shadow: var(--focus) !important; }
  /* 입력칸: 안쪽으로 눌린 모양 */
  .field { width: 100%; min-width: 0; background: var(--sunk); border: 1.5px solid rgba(0,0,0,.05); border-radius: 1rem; padding: .65rem 1rem; font-size: .875rem;
    box-shadow: var(--press); transition: box-shadow .15s, background .15s; color: var(--ink); }
  .field:focus { outline: none; background: #e9e9e8; box-shadow: var(--press), var(--focus); }
  .field::placeholder { color: #a2a2a8; }
  select.field { appearance: none; -webkit-appearance: none; padding-right: 2rem; cursor: pointer;
    background-image: linear-gradient(45deg, transparent 50%, var(--ink) 50%), linear-gradient(135deg, var(--ink) 50%, transparent 50%);
    background-position: calc(100% - 1rem) 55%, calc(100% - .7rem) 55%; background-size: .3rem .3rem; background-repeat: no-repeat; }
  /* 토글 스위치 */
  .switch { appearance: none; -webkit-appearance: none; flex: none; position: relative; width: 2.9rem; height: 1.65rem; border-radius: 9999px; cursor: pointer;
    background: var(--sunk); box-shadow: var(--press); transition: background .2s; }
  .switch::before { content: ''; position: absolute; top: 50%; left: .18rem; width: 1.3rem; height: 1.3rem; border-radius: 9999px; transform: translateY(-50%);
    background: linear-gradient(180deg, #fff, #ececeb); box-shadow: 0 3px 6px -1px rgba(0,0,0,.28), inset 0 -1px 0 rgba(0,0,0,.06); transition: left .2s; }
  .switch:checked { background: linear-gradient(180deg, rgb(150,150,157), rgb(128,128,135)); box-shadow: inset 0 2px 4px rgba(0,0,0,.25); }
  .switch:checked::before { left: calc(100% - 1.48rem); }
  /* 객관식·복수 선택 보기 */
  .opt { display: block; margin-bottom: .55rem; cursor: pointer; }
  .opt > span { display: flex; align-items: center; gap: .85rem; padding: .7rem 1rem; border-radius: 1rem; background: var(--face);
    border: 1px solid rgba(0,0,0,.04); box-shadow: var(--raise-sm); transition: background .15s, box-shadow .15s; }
  .opt:hover > span { background: #f6f6f5; }
  .opt .bullet { flex: none; width: 1.8rem; height: 1.8rem; border-radius: .6rem; display: grid; place-items: center; font-family: Inter; font-weight: 600; font-size: .78rem;
    background: var(--face); border: 1px solid rgba(0,0,0,.05); box-shadow: var(--raise-sm); }
  .opt.multi .bullet { border-radius: .4rem; }
  .opt input:checked + span { background: var(--sunk); box-shadow: var(--press); font-weight: 600; }
  .opt input:checked + span .bullet { background: linear-gradient(180deg, rgb(160,160,167), rgb(136,136,143)); color: #fff; }
  .opt input:focus-visible + span { box-shadow: var(--focus); }
  .opt.correct > span, .opt.correct input:checked + span { background: rgba(var(--ok),.1); border-color: rgba(var(--ok),.5); box-shadow: inset 0 0 0 1px rgba(var(--ok),.35); }
  .opt.correct .bullet { background: rgb(var(--ok)) !important; color: #fff !important; border-color: rgb(var(--ok)) !important; }
  .opt.wrong > span, .opt.wrong input:checked + span { background: rgba(var(--ng),.08); border-color: rgba(var(--ng),.45); box-shadow: inset 0 0 0 1px rgba(var(--ng),.3);
    text-decoration: line-through; text-decoration-color: rgba(var(--ng),.55); }
  .opt.wrong .bullet { background: rgb(var(--ng)) !important; color: #fff !important; border-color: rgb(var(--ng)) !important; }
  .locked .opt, .locked .ox { pointer-events: none; }
  /* OX 큰 키 */
  .ox { display: block; cursor: pointer; }
  .ox > span { display: grid; place-items: center; height: 5rem; border-radius: 1.4rem; background: var(--face); border: 1px solid rgba(0,0,0,.04);
    font-family: Inter; font-size: 2.2rem; font-weight: 500; box-shadow: var(--raise); transition: box-shadow .15s, background .15s; }
  .ox:hover > span { background: #f6f6f5; }
  .ox input:checked + span { background: var(--sunk); box-shadow: var(--press); }
  .ox input:focus-visible + span { box-shadow: var(--focus); }
  .ox.correct > span { background: rgba(var(--ok),.12) !important; color: rgb(var(--ok)); box-shadow: inset 0 0 0 1.5px rgba(var(--ok),.5); }
  .ox.wrong > span { background: rgba(var(--ng),.1) !important; color: rgb(var(--ng)); box-shadow: inset 0 0 0 1.5px rgba(var(--ng),.45); }
  .short-in.correct { background: rgba(var(--ok),.1); box-shadow: inset 0 0 0 1.5px rgba(var(--ok),.55); }
  .short-in.wrong { background: rgba(var(--ng),.08); box-shadow: inset 0 0 0 1.5px rgba(var(--ng),.5); }
  /* 개수 스테퍼 */
  .step { width: 1.9rem; height: 1.9rem; border-radius: .7rem; display: grid; place-items: center; font-weight: 600; color: var(--ink);
    background: var(--face); border: 1px solid rgba(0,0,0,.05); box-shadow: var(--raise-sm); }
  .step:hover:not(:disabled) { background: #f6f6f5; }
  .step:active:not(:disabled) { box-shadow: var(--press); background: var(--sunk); }
  .step:disabled { opacity: .45; box-shadow: none; }
  .icon-btn { width: 1.9rem; height: 1.9rem; border-radius: 9999px; display: inline-grid; place-items: center; font-size: .78rem; color: var(--ink);
    background: var(--face); border: 1px solid rgba(0,0,0,.05); box-shadow: var(--raise-sm); }
  .icon-btn:hover { background: #f6f6f5; }
  .icon-btn:active { box-shadow: var(--press); background: var(--sunk); }
  .icon-btn.danger:hover { color: rgb(var(--ng)); }
  .spinner { border: 2px solid currentColor; border-right-color: transparent; border-radius: 9999px; width: 1rem; height: 1rem; animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---------- 플레이어 ---------- */
  #ytWrap iframe { width: 100%; height: 100%; display: block; }
  .player-box { position: relative; aspect-ratio: 16 / 9; border-radius: 1.6rem; overflow: hidden; background: #1d1d1f;
    box-shadow: 0 14px 26px -12px rgba(0,0,0,.35), 0 3px 0 -1px rgba(0,0,0,.08); }
  /* 휴대폰·태블릿: 플레이어를 화면 위에 고정 */
  @media (max-width: 1023px) {
    .player-stick { position: sticky; top: 0; z-index: 40; margin: 0 -1rem; padding: .5rem 1rem; background: var(--bg);
      box-shadow: 0 10px 14px -12px rgba(0,0,0,.3); }
    .player-box { border-radius: 1.1rem; }
  }
  @media (min-width: 640px) and (max-width: 1023px) { .player-stick { margin: 0 -1.5rem; padding: .6rem 1.5rem; } }
  /* 구간 북마크 바: 눌린 홈 + 파란 진행 + 모양으로 구분한 표시(퀴즈 ◆ · 북마크 ▲ · 노트 ●) */
  .bar { position: relative; height: 3.3rem; cursor: pointer; touch-action: none; border-radius: .8rem; flex: 1 1 auto; min-width: 0; }
  .bar-track { position: absolute; left: 0; right: 0; top: 50%; height: .62rem; transform: translateY(-50%); border-radius: 9999px; background: var(--sunk);
    box-shadow: var(--press); overflow: hidden; }
  .bar-fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: rgb(var(--accent)); border-radius: 9999px; }
  .bar-loop { position: absolute; top: 0; bottom: 0; background: rgba(var(--accent),.28); display: none; }
  .bar-head { position: absolute; top: 50%; left: 0; width: 1.05rem; height: 1.05rem; border-radius: 9999px; transform: translate(-50%,-50%); pointer-events: none;
    background: linear-gradient(180deg, #fff, #ececeb); box-shadow: 0 3px 7px -1px rgba(0,0,0,.3), inset 0 -1px 0 rgba(0,0,0,.06); border: 1px solid rgba(0,0,0,.06); z-index: 2; }
  .mk { position: absolute; width: 1.15rem; height: 1.15rem; transform: translateX(-50%); display: grid; place-items: center; padding: 0; border: 0; background: none; cursor: pointer; z-index: 3; border-radius: .3rem; }
  .mk::before { content: ''; display: block; transition: transform .15s; }
  .mk:hover::before { transform: scale(1.25); }
  .mk-quiz { top: calc(50% - .575rem); }
  .mk-quiz::before { width: .6rem; height: .6rem; background: var(--ink); transform: rotate(45deg); border-radius: 1px; box-shadow: 0 0 0 2px var(--face); }
  .mk-quiz:hover::before { transform: rotate(45deg) scale(1.25); }
  .mk-quiz.done::before { background: rgb(var(--ok)); }
  .mk-book { top: 0; }
  .mk-book::before { width: .72rem; height: .62rem; background: #55555b; clip-path: polygon(50% 0, 100% 100%, 0 100%); }
  .mk-note { bottom: 0; }
  .mk-note::before { width: .5rem; height: .5rem; border-radius: 9999px; background: #8a8a90; }
  .mk-conf { bottom: 0; }
  .mk-conf::before { content: '✕'; font-size: .72rem; font-weight: 700; line-height: 1; color: #4a4a50; }
  .mk-ask { top: 0; }
  .mk-ask::before { content: '?'; font-size: .78rem; font-weight: 800; line-height: 1; color: #4a4a50; }
  .mk-quiz.info::before { transform: none; border-radius: 2px; background: #55555b; }
  .mk-quiz.info:hover::before { transform: scale(1.25); }
  .dist { display: inline-flex; align-items: center; gap: .25rem; padding: .1rem .45rem; border-radius: 9999px; background: var(--sunk); font-size: 10.5px; font-family: Inter, 'Noto Sans KR'; }
  .dist.right { background: rgba(var(--ok),.14); color: #2a6b3d; font-weight: 700; }
  .dist.top { box-shadow: inset 0 0 0 1.5px rgba(var(--ng),.55); color: #9a3027; font-weight: 700; }
  /* 영상 위 자막 (접근성) */
  .cc-box { position: absolute; left: 0; right: 0; bottom: 11%; display: flex; justify-content: center; padding: 0 6%; pointer-events: none; z-index: 5; text-align: center; }
  .tab-btn[aria-pressed="true"] { background: var(--face); color: var(--ink); box-shadow: var(--raise-sm); }
  .cc-box span { white-space: pre-line; background: rgba(0,0,0,.74); color: #fff; border-radius: .45rem; padding: .2em .6em; line-height: 1.5; font-weight: 500;
    -webkit-box-decoration-break: clone; box-decoration-break: clone; }
  .cc-box.cc-s span { font-size: clamp(11px, 1.6vw, 15px); }
  .cc-box.cc-m span { font-size: clamp(13px, 2.1vw, 20px); }
  .cc-box.cc-l span { font-size: clamp(16px, 2.8vw, 28px); }
  .player-box:fullscreen { border-radius: 0; }
  .player-box:fullscreen .cc-box.cc-s span { font-size: 2vw; }
  .player-box:fullscreen .cc-box.cc-m span { font-size: 2.6vw; }
  .player-box:fullscreen .cc-box.cc-l span { font-size: 3.4vw; }
  .pill[aria-pressed="true"] { background: var(--sunk); box-shadow: var(--press); font-weight: 600; }
  #qrBox img, #qrBox canvas, #qrBig img, #qrBig canvas { display: block; max-width: 100%; height: auto; }
  .legend i { font-style: normal; color: var(--ink); }
  /* 노트 · 자막 목록 */
  .tchip { flex: none; display: inline-flex; align-items: center; gap: .25rem; font-family: Inter; font-variant-numeric: tabular-nums; font-size: 11px; font-weight: 600;
    padding: .18rem .6rem; border-radius: 9999px; background: var(--sunk); box-shadow: var(--press); color: var(--ink); cursor: pointer; }
  .tchip:hover { color: rgb(var(--accent)); }
  .note-list, .cue-list { position: relative; scroll-behavior: smooth; overscroll-behavior: contain; }
  .note-item { display: flex; gap: .6rem; align-items: flex-start; padding: .6rem .65rem; border-radius: 1rem; background: var(--face);
    border: 1px solid rgba(0,0,0,.04); box-shadow: var(--raise-sm); transition: background .2s, box-shadow .2s; }
  .note-item.active { background: rgba(var(--accent),.07); box-shadow: inset 3px 0 0 rgb(var(--accent)), var(--raise-sm); }
  .note-item.active .tchip { color: rgb(var(--accent)); }
  .note-item.ai { background: #f4f4f3; }
  .cue { display: flex; width: 100%; gap: .6rem; align-items: flex-start; padding: .4rem .55rem; border-radius: .8rem; text-align: left; transition: background .2s; }
  .cue:hover { background: #f6f6f5; }
  .cue.active { background: rgba(var(--accent),.08); box-shadow: inset 3px 0 0 rgb(var(--accent)); }
  .cue .tchip { pointer-events: none; }
  mark { background: rgba(var(--accent),.2); color: inherit; border-radius: .2rem; padding: 0 .1rem; }
  .flash { animation: flash 1.2s ease-out; }
  @keyframes flash { 0%, 40% { box-shadow: var(--focus), var(--raise); } 100% { box-shadow: var(--raise); } }
  .title-in { width: 100%; min-width: 0; background: transparent; border: 0; border-radius: .6rem; padding: .1rem .3rem; margin-left: -.3rem;
    font-weight: 700; font-size: 1.05rem; line-height: 1.4; color: var(--ink); text-overflow: ellipsis; }
  .title-in:not([readonly]):hover { background: var(--sunk); }
  .title-in:not([readonly]):focus { outline: none; background: var(--sunk); box-shadow: var(--press), var(--focus); }
  .title-in[readonly] { cursor: default; }
  .stat { min-width: 0; border-radius: 1.2rem; padding: .8rem 1rem; background: var(--face); box-shadow: var(--raise-sm); border: 1px solid rgba(0,0,0,.04); }
  .stat b { display: block; font-family: Inter; font-size: 1.5rem; font-weight: 600; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .stat span { font-size: 11px; color: var(--mute); }
  .meter { height: .45rem; border-radius: 9999px; background: var(--sunk); box-shadow: var(--press); overflow: hidden; min-width: 3rem; }
  .meter > i { display: block; height: 100%; background: rgb(var(--accent)); border-radius: 9999px; }
  .meter.low > i { background: rgb(var(--ng)); }

  /* ---------- 모달: 넓은 화면은 가운데 카드, 휴대폰은 아래에서 올라오는 시트 ---------- */
  .modal-back { position: fixed; inset: 0; z-index: 70; display: flex; align-items: center; justify-content: center; padding: 1.25rem;
    background: rgba(40,40,44,.4); -webkit-backdrop-filter: blur(2px); backdrop-filter: blur(2px); }
  .modal-back.hidden { display: none; }
  .sheet { width: 100%; max-width: 34rem; max-height: calc(100dvh - 2.5rem); overflow-y: auto; overscroll-behavior: contain; background: var(--face);
    border-radius: 2rem; padding: 1.5rem 1.5rem 1.35rem; box-shadow: 0 30px 60px -20px rgba(0,0,0,.45), inset 0 1px 0 #fff; animation: pop .18s ease-out; }
  .sheet-grip { display: none; }
  @keyframes pop { from { transform: scale(.97); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes sheetUp { from { transform: translateY(100%); } to { transform: none; } }
  @media (max-width: 767px) {
    .modal-back { align-items: flex-end; padding: 0; }
    .sheet { max-width: none; border-radius: 1.75rem 1.75rem 0 0; max-height: 88dvh; padding: .8rem 1.1rem calc(1.25rem + env(safe-area-inset-bottom));
      animation: sheetUp .26s cubic-bezier(.2,.8,.2,1); box-shadow: 0 -16px 40px -16px rgba(0,0,0,.4), inset 0 1px 0 #fff; }

// 예전 localStorage 값은 읽을 수 있고, 새로 저장하면 IndexedDB로 옮겨지며 localStorage 쪽은 지워 공간을 비움
const idb = (() => {
  let dbp = null;
  const open = () => dbp || (dbp = new Promise((res, rej) => {
    const r = indexedDB.open('cliplab', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('kv');
    r.onsuccess = () => res(r.result);
    r.onerror = () => { dbp = null; rej(r.error); };
  }));
  const run = async (mode, fn) => {
    const db = await open();
    return new Promise((res, rej) => {
      const t = db.transaction('kv', mode), req = fn(t.objectStore('kv'));
      t.oncomplete = () => res(req.result);
      t.onerror = t.onabort = () => rej(t.error || req.error);
    });
  };
  return { get: k => run('readonly', s => s.get(k)), set: (k, v) => run('readwrite', s => s.put(v, k)), del: k => run('readwrite', s => s.delete(k)),
    keys: () => run('readonly', s => s.getAllKeys()) };
})();

function normQuiz(q) {
  const type = TYPES[q?.type] ? q.type : 'mcq';
  const o = { id: q?.id || uid(), t: Math.max(0, Math.round((+q?.t || 0) * 10) / 10), type, q: String(q?.q ?? ''),
    options: [], answer: null, accept: [], explanation: String(q?.explanation ?? ''), hint: String(q?.hint ?? ''),
    mustPass: q?.mustPass !== undefined ? !!q.mustPass : type !== 'short' };
  if (type === 'mcq' || type === 'multi') {
    o.options = (Array.isArray(q.options) ? q.options : []).map(x => String(x ?? '')).slice(0, 8);
    if (o.options.length < 2) o.options = [...o.options, '', '', '', ''].slice(0, 4);
    if (type === 'mcq') {
      const a = Number(Array.isArray(q.answer) ? q.answer[0] : q.answer);
      o.answer = Number.isInteger(a) ? Math.min(Math.max(a, 0), o.options.length - 1) : 0;
    } else {
      const a = Array.isArray(q.answer) ? q.answer : [q.answer];
      o.answer = [...new Set(a.map(Number).filter(n => Number.isInteger(n) && n >= 0 && n < o.options.length))].sort((x, y) => x - y);
    }
  } else if (type === 'ox') {
    o.answer = q.answer === true || q.answer === 'true' || String(q.answer).toUpperCase() === 'O';
  } else {
    o.answer = String(q.answer ?? '');
    o.accept = (Array.isArray(q.accept) ? q.accept : String(q.accept || '').split(',')).map(s => String(s).trim()).filter(Boolean);
  }
  return o;
}
const qValid = q => q.q.trim() && (q.type === 'ox' || q.type === 'essay' || q.type === 'info' || (q.type === 'short' ? q.answer.trim()
  : q.options.every(o => o.trim()) && (q.type === 'mcq' || q.answer.length > 0)));
function normRecord(r) {
  const o = {
    vid: String(r.vid || ''), src: r.src || { kind: 'yt', id: SAMPLE_ID }, title: String(r.title || ''), titleAuto: r.titleAuto !== false,
    sample: !!r.sample, hid: r.hid || null, duration: +r.duration || 0, blockSkip: !!r.blockSkip,
    quizzes: (r.quizzes || []).map(normQuiz),
    bookmarks: (r.bookmarks || []).map(b => ({ id: b.id || uid(), t: Math.max(0, +b.t || 0), label: String(b.label ?? ''), auto: !!b.auto })),
    notes: (r.notes || []).map(n => ({ id: n.id || uid(), t: Math.max(0, +n.t || 0), text: String(n.text ?? ''), ai: !!n.ai })),
    cues: (r.cues || []).filter(c => c && c.text).map(c => ({ s: +c.s || 0, e: +c.e || 0, text: String(c.text) })),
    approx: !!r.approx, updated: r.updated || Date.now(),
    deploy: { due: String(r.deploy?.due || ''), minWatch: Math.min(100, Math.max(0, Math.round(+r.deploy?.minWatch || 0))), url: String(r.deploy?.url || '') },
    endSummary: (Array.isArray(r.endSummary) ? r.endSummary : []).map(String).filter(s => s.trim()),
    tr: Array.isArray(r.tr?.texts) && r.tr.texts.length ? { lang: String(r.tr.lang || ''), texts: r.tr.texts.map(x => String(x ?? '')) } : null // 자막 번역 (cues와 같은 순서)
  };
  if (!o.vid) o.vid = vidOf(o.src);
  sortAll(o);
  return o;
}

// SRT · VTT · "[mm:ss] 문장" · 일반 텍스트 → [{s, e, text}]
function parseSubs(text, d) {
  text = String(text).replace(/^﻿/, '').replace(/\r/g, '').trim();
  const T = '((?:\\d{1,2}:)?\\d{1,2}:\\d{2}(?:[.,]\\d{1,3})?)';
  const arrow = new RegExp(`${T}\\s*-->\\s*${T}`);
  const clean = s => s.replace(/<[^>]+>/g, '').replace(/\{\\[^}]*\}/g, '').replace(/\s+/g, ' ').trim();
  let cues = [], approx = false;
  if (arrow.test(text)) {
    for (const block of text.split(/\n\s*\n/)) {
      const lines = block.split('\n');
      const k = lines.findIndex(l => arrow.test(l));
      if (k < 0) continue;
      const m = lines[k].match(arrow);

const CHECKERS = {

// ---------- AI 요청: 응답 텍스트에서 JSON만 꺼냄 ----------
async function postJSON(url, headers, payload) {
  const res = await fetch(url, { method: 'POST', headers: { 'content-type': 'application/json', ...headers }, body: JSON.stringify(payload) });
  const body = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(body?.error?.message || `HTTP ${res.status}`);
  return body;
}
const REQUESTERS = {
  async claude(key, model, text) {
    const body = await postJSON('https://api.anthropic.com/v1/messages', ANT_H(key), { model, max_tokens: 8192, messages: [{ role: 'user', content: text }] });
    return (body.content || []).filter(c => c.type === 'text').map(c => c.text).join('');
  },
  async openai(key, model, text) {
    const body = await postJSON('https://api.openai.com/v1/chat/completions', { authorization: `Bearer ${key}` },
      { model, response_format: { type: 'json_object' }, messages: [{ role: 'user', content: text }] });
    return body.choices?.[0]?.message?.content || '';
  },
  async gemini(key, model, text) {
    const body = await postJSON(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent`, { 'x-goog-api-key': key },
      { contents: [{ role: 'user', parts: [{ text }] }], generationConfig: { responseMimeType: 'application/json' } });
    return (body.candidates?.[0]?.content?.parts || []).map(p => p.text || '').join('');
  }
};
function aiReady(msgEl) {

  if (!rec.cues.length) { flash(msgEl, 'ng', '✘ 먼저 자막(SRT·VTT 파일 또는 대본)을 넣으세요. AI는 자막 내용을 읽고 만듭니다.'); return false; }
  return true;
}
async function aiJSON(prompt) {
  const out = await REQUESTERS[provider](keys[provider].trim(), models[provider].trim() || PROVIDERS[provider].model, prompt);
  const m = out.match(/\{[\s\S]*\}/);
  if (!m) throw new Error('응답에서 JSON을 찾지 못했습니다.');
  return JSON.parse(m[0]);
}
// 자막 → "[mm:ss] 문장" (너무 길면 고르게 줄임)
function transcript(from = 0, to = Infinity, max = 60000) {
  let lines = rec.cues.filter(c => c.e >= from && c.s <= to).map(c => `[${fmt(c.s)}] ${c.text}`);
  let text = lines.join('\n');
  if (text.length > max) { const step = Math.ceil(text.length / max); lines = lines.filter((_, i) => i % step === 0); text = lines.join('\n'); }
  return text;
}

function saveBlob(blob, filename) {

  a.href = URL.createObjectURL(blob);

  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1500);
}

// ---------- 온라인 공유 링크: 앱 웹 주소 + #cl=(압축한 영상·퀴즈·북마크·자막) ----------
// 서버 없이 링크 하나로 배포. 링크를 연 학생 화면은 학생용 HTML과 같은 시청 모드
const b64u = {
  enc: bytes => { let s = ''; for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode(...bytes.subarray(i, i + 0x8000)); return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); },
  dec: str => Uint8Array.from(atob(str.replace(/-/g, '+').replace(/_/g, '/')), c => c.charCodeAt(0))
};
const streamBytes = async (bytes, tf) => new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(tf)).arrayBuffer());
async function packShare(obj) {
  const raw = new TextEncoder().encode(JSON.stringify(obj));
  return window.CompressionStream ? 'z.' + b64u.enc(await streamBytes(raw, new CompressionStream('deflate-raw'))) : 'j.' + b64u.enc(raw);
}
async function unpackShare([kind, data]) {
  let bytes = b64u.dec(data);
  if (kind === 'z') bytes = await streamBytes(bytes, new DecompressionStream('deflate-raw'));
  return JSON.parse(new TextDecoder().decode(bytes));
}
const isLocalHost = h => /^(localhost|127\.|0\.0\.0\.0|\[::1\]$)/.test(h) || /\.(localhost|test)$/.test(h);
const pageAppUrl = () => /^https?:$/.test(location.protocol) && !isLocalHost(location.hostname) ? location.origin + location.pathname : '';

}

}

// 학생용 링크 QR 코드 (qrcodejs, 필요할 때만 불러옴)
let qrLib = null;
const loadQR = () => qrLib || (qrLib = new Promise((res, rej) => {
  if (window.QRCode) return res();
  const s = document.createElement('script');
  s.src = 'https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js';
  s.onload = res;
  s.onerror = () => { qrLib = null; rej(new Error('QR 코드 도구를 불러오지 못했습니다. 인터넷 연결을 확인하세요.')); };
  document.head.appendChild(s);
}));
async function drawQR(el, url, size) {
  await loadQR();
  el.innerHTML = '';
  new QRCode(el, { text: url, width: size, height: size, colorDark: '#1d1d1f', colorLight: '#ffffff', correctLevel: QRCode.CorrectLevel.M });
}
const qrUrlOK = u => /^https?:\/\/\S+\.\S+/i.test(u);
$('qrMake').onclick = async () => {
  const url = $('qrUrl').value.trim();
  if (!qrUrlOK(url)) return flash($('qrMsg'), 'ng', '✘ https:// 로 시작하는 웹 주소를 넣으세요. (학생용 HTML을 LMS·GitHub Pages 등에 올린 주소)');
  rec.deploy.url = url; persist();
  try {
    await drawQR($('qrBox'), url, 240);
    $('qrOut').classList.remove('hidden');
    $('qrMsg').classList.add('hidden');
  } catch (err) { flash($('qrMsg'), 'ng', '✘ ' + err.message); }
};
$('qrUrl').addEventListener('keydown', e => { if (e.key === 'Enter') $('qrMake').click(); });
$('qrPng').onclick = () => {
  const c = $('qrBox').querySelector('canvas');
  if (!c) return;
  // 흰 여백을 둘러 인쇄·발표 자료에 붙이기 좋게
  const pad = 24, out = document.createElement('canvas');
  out.width = c.width + pad * 2; out.height = c.height + pad * 2;
  const g = out.getContext('2d');
  g.fillStyle = '#fff'; g.fillRect(0, 0, out.width, out.height); g.drawImage(c, pad, pad);
  out.toBlob(b => saveBlob(b, `QR_${safeName(rec.title)}.png`));
};

// ---------- 학생 모드: 학생 정보 · 진행 · 제출 ----------
function stuStats() {
  const qs = rec.quizzes.filter(qValid);
  const graded = qs.filter(q => q.type !== 'essay' && q.type !== 'info'); // 서술형·설명 카드는 점수에서 뺌
  const done = qs.filter(isDone).length, first = graded.filter(q => prog.results[q.id]?.firstCorrect === true).length;
  const d = Math.floor(dur());
  const watched = d ? prog.visits.slice(0, d).filter(v => v > 0).length : 0;
  return { qs, graded, done, first, score: graded.length ? Math.round(first / graded.length * 100) : 0, watched, ratio: d ? Math.min(1, watched / d) : 0, d };
}
function renderStu() {
  if (!STUDENT) return;
  const s = stuStats(), st = prog.student;
  $('stuInfo').textContent = st ? `${st.name} · ${st.dept} · ${st.sid}` : '학생 정보를 입력하세요';
  $('stuSolved').textContent = `${s.done}/${s.qs.length}`;
  $('stuScore').textContent = s.score;
  $('stuWatch').textContent = `${Math.round(s.ratio * 100)}%`;
  // 마감·최소 시청 비율 안내
  const dp = rec.deploy, due = dueDate(), parts = [];
  let bad = false;
  if (due) {
    const left = due - Date.now(), days = Math.ceil(left / 86400000);
    const when = due.toLocaleString('ko-KR', { month: 'numeric', day: 'numeric', weekday: 'short', hour: '2-digit', minute: '2-digit' });
    if (left < 0) { parts.push(`⏰ 마감 ${when} · 마감이 지났습니다 (지금 제출하면 "지각")`); bad = true; }
    else parts.push(`⏰ 마감 ${when} · ${days <= 1 ? (left < 3600000 ? `${Math.max(1, Math.round(left / 60000))}분 남음` : '오늘·내일 마감') : `D-${days}`}`);
  }
  if (dp.minWatch) {
    const ok = s.ratio * 100 >= dp.minWatch;
    parts.push(`👁 최소 시청 ${dp.minWatch}% · 지금 ${Math.round(s.ratio * 100)}% ${ok ? '✔ 충족' : '— 아직 부족'}`);
    if (!ok) bad = true;
  }
  $('stuDue').classList.toggle('hidden', !parts.length);
  $('stuDue').className = `${parts.length ? '' : 'hidden '}rounded-2xl px-3 py-2 text-[11px] leading-relaxed ${bad ? 'glass-ng' : 'glass-ok'}`;
  $('stuDue').innerHTML = parts.map(esc).join('<br>');
}
const dueDate = () => { const d = rec?.deploy.due ? new Date(rec.deploy.due) : null; return d && !isNaN(d) ? d : null; };

// 제출 내용(파일·결과 코드 공용). 조건 미달이면 확인을 받고, 취소하면 null
function buildResult(how) {
  if (!prog.student) { openStuModal(); return null; }
  const s = stuStats();
  const due = dueDate(), late = !!due && Date.now() > due, minWatch = rec.deploy.minWatch, watchOK = s.ratio * 100 >= minWatch;
  const warn = [
    s.done < s.qs.length ? `퀴즈 ${s.qs.length}개 중 ${s.done}개만 풀었습니다.` : '',
    !watchOK ? `시청 비율 ${Math.round(s.ratio * 100)}%로 최소 기준 ${minWatch}%보다 낮아 "시청 미달"로 표시됩니다.` : '',
    late ? '마감이 지나 "지각"으로 표시됩니다.' : ''
  ].filter(Boolean);
  if (warn.length && !confirm(`${warn.join('\n')}\n\n그래도 지금 ${how}할까요?`)) return null;
  const body = {
    app: 'cliplab-result', appVersion: APP_VERSION, vid: rec.vid, title: rec.title, course: { ...course }, student: prog.student,
    submittedAt: new Date().toISOString(), duration: s.d, watchedSec: s.watched, watchRatio: Math.round(s.ratio * 1000) / 1000,
    score: s.score, correctFirst: s.first, total: s.graded.length,
    due: rec.deploy.due, late, minWatch, watchOK,
    quizzes: s.qs.map(q => { const r = prog.results[q.id] || {}; return { id: q.id, t: q.t, type: q.type, q: q.q, attempts: r.attempts || 0, firstCorrect: r.firstCorrect === true, correct: !!r.correct, passed: !!r.passed,
      ...(q.type === 'essay' ? { text: r.text || '' } : {}),
      ...(['mcq', 'multi', 'ox', 'short'].includes(q.type) ? { first: r.first ?? null, key: q.type === 'ox' ? (q.answer ? 'O' : 'X') : q.answer, options: q.options } : {}) }; }),
    visits: Array.from({ length: s.d }, (_, i) => prog.visits[i] || 0),
    confused: [...prog.confused],
    questions: prog.questions.map(x => ({ t: x.t, text: x.text })),
    notes: prog.notes.map(n => ({ t: n.t, text: n.text }))
  };
  body.sig = hash(JSON.stringify(body) + '|cliplab');
  return body;
}
$('stuSubmit').onclick = () => {
  const body = buildResult('제출 파일을 저장');
  if (!body) return;
  saveBlob(new Blob([JSON.stringify(body, null, 1)], { type: 'application/json;charset=utf-8' }), `결과_${safeName(prog.student.sid)}_${safeName(prog.student.name)}.json`);
  flash($('noteMsg'), 'ok', '✔ 제출 파일을 저장했습니다. 내려받은 JSON 파일을 제출하세요.');
};

// ---------- 전체 백업 · 복원 (API 키 제외) ----------
const isBigKey = k => typeof k === 'string' && (k === HIST_KEY || k.startsWith('cliplab-video:'));
$('backupBtn').onclick = async () => {
  const all = new Set();
  try { (await idb.keys()).forEach(k => all.add(k)); } catch {}
  try { for (let i = 0; i < localStorage.length; i++) all.add(localStorage.key(i)); } catch {}
  const data = {};
  for (const k of all) if (isBigKey(k)) data[k] = await bigStore.get(k);
  const saved = Array.isArray(data[HIST_KEY]) ? data[HIST_KEY] : [];
  data[HIST_KEY] = [...history, ...saved.filter(x => !history.some(y => y.hid === x.hid))];
  if (rec && !STUDENT) data['cliplab-video:' + rec.vid] = JSON.parse(JSON.stringify(rec));
  const settings = { ...store.get(STORE_KEY, {}) };
  delete settings.keys;
  const videos = Object.keys(data).filter(k => k !== HIST_KEY).length;
  download(JSON.stringify({ app: 'cliplab-backup', version: 1, appVersion: APP_VERSION, createdAt: new Date().toISOString(), settings, cc: store.get('cliplab-cc', {}), data }),
    'CLIPLAB_전체백업', 'json', 'application/json');
  flash($('srcMsg'), 'ok', `✔ 전체 백업을 저장했습니다. (히스토리 ${(data[HIST_KEY] || []).length}개 · 영상 기록 ${videos}개 · 설정, API 키 제외)`);
};
$('restoreFile').onchange = async e => {
  const file = e.target.files[0];
  e.target.value = '';
  if (!file) return;
  let b;
  try { b = JSON.parse(await file.text()); } catch { return flash($('srcMsg'), 'ng', '✘ 백업 파일을 읽을 수 없습니다.'); }
  if (b?.app !== 'cliplab-backup' || typeof b.data !== 'object') return flash($('srcMsg'), 'ng', '✘ CLIPLAB 전체 백업 파일이 아닙니다.');
  const keysIn = Object.keys(b.data).filter(isBigKey), hist = Array.isArray(b.data[HIST_KEY]) ? b.data[HIST_KEY] : [];
  if (!confirm(`${localTime(b.createdAt)} 백업에서 히스토리 ${hist.length}개 · 영상 기록 ${keysIn.filter(k => k !== HIST_KEY).length}개 · 설정을 되살립니다.\n같은 영상의 기록은 백업 내용으로 바뀌고, 히스토리는 지금 목록과 합칩니다. 계속할까요?`)) return;
  const fails = [];
  for (const k of keysIn) {
    if (k === HIST_KEY) continue;
    const ok = await bigStore.set(k, b.data[k]);
    if (ok !== true) fails.push(ok);
  }
  const merged = [...hist, ...history.filter(h => !hist.some(x => x.hid === h.hid))].sort((x, y) => y.date - x.date);
  const ok = await bigStore.set(HIST_KEY, merged);
  if (ok !== true) fails.push(ok);
  if (b.settings) { applySettings({ ...b.settings, keys: undefined }); saveSettings(); }
  if (b.cc) store.set('cliplab-cc', b.cc);
  if (!canPersist) {
    history = merged; renderHistory();
    const r = b.data['cliplab-video:' + lastVid] || (hist[0]?.snap);
    if (r) openRecord(r);
    return flash($('srcMsg'), 'info', `✔ 백업을 이 화면에 불러왔습니다(히스토리 ${merged.length}개). 이 화면은 브라우저 저장이 막혀 새로고침하면 다시 사라지니, 크롬·엣지에서 직접 열어 복원하는 것을 권합니다.`);
  }
  if (fails.length) return flash($('srcMsg'), 'ng', '✘ 일부를 되살리지 못했습니다: ' + fails[0]);
  flash($('srcMsg'), 'ok', '✔ 백업을 되살렸습니다. 잠시 뒤 화면을 새로 고칩니다.');
  setTimeout(() => location.reload(), 900);
};

const WHISPER_MAX = 24 * 1024 * 1024; // API 한도 25MB보다 조금 작게
async function whisper(blob, name, offset, lang, key) {
  const fd = new FormData();
  fd.append('file', blob, name);
  fd.append('model', 'whisper-1');
  fd.append('response_format', 'verbose_json');
  if (lang) fd.append('language', lang);
  const res = await fetch('https://api.openai.com/v1/audio/transcriptions', { method: 'POST', headers: { authorization: `Bearer ${key}` }, body: fd });
  const body = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(body?.error?.message || `HTTP ${res.status}`);
  return (body.segments || []).map(s => ({ s: s.start + offset, e: s.end + offset, text: String(s.text || '').trim() })).filter(c => c.text);
}

}

$('bankCsv').onclick = () => {

  const c = v => `"${String(v ?? '').replace(/"/g, '""')}"`;

  download('﻿' + [BANK_HEAD, ...rows].map(r => r.map(c).join(',')).join('\r\n'), `문제은행_${safeName(rec.title)}`, 'csv', 'text/csv');
};
function parseCSV(text) {
  const rows = []; let row = [], cell = '', q = false;
  text = text.replace(/^﻿/, '');
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) { if (ch === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += ch; }
    else if (ch === '"') q = true;
    else if (ch === ',') { row.push(cell); cell = ''; }
    else if (ch === '\n' || ch === '\r') { if (ch === '\r' && text[i + 1] === '\n') i++; row.push(cell); rows.push(row); row = []; cell = ''; }
    else cell += ch;
  }
  if (cell || row.length) { row.push(cell); rows.push(row); }
  return rows.filter(r => r.some(x => x.trim()));
}
const typeKey = v => { v = String(v || '').trim(); return TYPES[v] ? v : Object.keys(TYPES).find(k => TYPES[k] === v) || (v === '단답' ? 'short' : v === '복수선택' ? 'multi' : 'mcq'); };
function bankFromCSV(text) {
  const rows = parseCSV(text);
  const head = rows[0]?.map(h => h.trim()) || [];
  const col = name => head.indexOf(name);
  if (col('문제') < 0) throw new Error('CSV 첫 줄에 "문제" 열이 있어야 합니다. 이 앱에서 내보낸 CSV 형식을 쓰세요.');
  return rows.slice(1).map(r => {
    const g = name => (col(name) >= 0 ? r[col(name)] ?? '' : '').trim();
    const type = typeKey(g('유형')), ans = g('정답');
    const options = ['보기1', '보기2', '보기3', '보기4', '보기5', '보기6'].map(g).filter(Boolean);
    return {
      t: parseTime(g('시간')), type, q: g('문제'), options, accept: g('인정 답안'), explanation: g('해설'), hint: g('힌트'),
      mustPass: g('통과 조건') ? !/틀려도/.test(g('통과 조건')) : undefined,
      answer: type === 'mcq' ? (+ans || 1) - 1 : type === 'multi' ? ans.split(/[;,\s]+/).filter(Boolean).map(a => +a - 1) : type === 'ox' ? /^(o|true|참|맞)/i.test(ans) : ans
    };
  });
}
function bankFromJSON(d) {
  if (Array.isArray(d)) return d;
  if (Array.isArray(d?.quizzes)) return d.quizzes;
  // QUIZLAB(01 퀴즈 생성기) 형식: { mcq: [...], ox: [...], short: [...], multi: [...], blank: [...] }
  const out = [];
  for (const [k, type] of [['mcq', 'mcq'], ['ox', 'ox'], ['short', 'short'], ['blank', 'short'], ['multi', 'multi']])
    if (Array.isArray(d?.[k])) out.push(...d[k].map(x => ({ ...x, type, t: undefined })));
  if (Array.isArray(d?.items)) out.push(...d.items.filter(x => TYPES[x.type] || x.type === 'blank').map(x => ({ ...x, type: x.type === 'blank' ? 'short' : x.type, t: undefined,
    ...(x.type === 'ox' && typeof x.answer === 'number' && Array.isArray(x.options) ? { answer: String(x.options[x.answer]).toUpperCase() === 'O', options: [] } : {}) })));
  return out;
}
$('bankImport').onchange = async e => {
  const file = e.target.files[0];
  e.target.value = '';
  if (!file) return;
  try {
    const text = await file.text();
    const raw = /^\s*[[{]/.test(text) ? bankFromJSON(JSON.parse(text)) : bankFromCSV(text);
    const items = raw.map(q => ({ has: q?.t != null && q.t !== '' && Number.isFinite(+q.t), q: normQuiz(q) })).filter(x => qValid(x.q));
    if (!items.length) throw new Error('가져올 수 있는 문항이 없습니다.');
    // 시간이 없는 문항은 영상 길이에 고르게 배치
    const d = dur(), noTime = items.filter(x => !x.has).length;
    let k = 0;
    items.forEach(x => {
      if (!x.has) x.q.t = Math.round((d || noTime * 60) * ++k / (noTime + 1));
      if (d) x.q.t = Math.min(x.q.t, Math.max(1, Math.floor(d - 1)));
    });
    const list = items.map(x => x.q);
    rec.quizzes.push(...list);
    rec.quizzes.sort(byT);
    persist(); renderBar(); renderEditor();
    flash($('bankMsg'), 'ok', `✔ "${file.name}"에서 퀴즈 ${list.length}개를 가져와 기존 퀴즈에 더했습니다.${noTime ? ` 시간이 없는 ${noTime}개는 영상 길이에 맞춰 고르게 배치했으니 확인하세요.` : ''}`);
  } catch (err) { flash($('bankMsg'), 'ng', '✘ 가져오기 실패: ' + err.message); }
};

// ---------- 성적 집계: 학생 제출 파일 여러 개 ----------
let gbFiles = [], gbVid = null;
const localTime = iso => { const d = new Date(iso); return isNaN(d) ? '' : `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`; };
function addResult(d, src) {
  if (d?.app !== 'cliplab-result' || !d.student) return false;
  const { sig, ...rest } = d;
  d.tampered = hash(JSON.stringify(rest) + '|cliplab') !== sig;
  d.file = src;
  gbFiles.push(d);
  return true;
}
function gbImported(added, skipped, what) {
  $('gbNote').textContent = `${added}개 불러옴${skipped ? ` · ${skipped}개는 CLIPLAB ${what}이 아니라 건너뜀` : ''}`;
  if (added) { gbVid = gbFiles.at(-1).vid; renderGradebook(); $('gradebook').scrollIntoView({ behavior: 'smooth', block: 'start' }); }
}
async function importResults(files) {
  let added = 0, skipped = 0;
  for (const f of files) {
    try { addResult(JSON.parse(await f.text()), f.name) ? added++ : skipped++; } catch { skipped++; }
  }
  gbImported(added, skipped, '제출 파일');
}
// 결과 코드: 붙여넣은 글에서 CLR1.… 만 골라 읽음

dropZone($('gbDrop'), importResults);
function gbRows() {
  // 같은 학번은 마지막 제출만
  const map = new Map();
  gbFiles.filter(d => d.vid === gbVid).sort((a, b) => String(a.submittedAt).localeCompare(String(b.submittedAt))).forEach(d => map.set(d.student.sid, d));
  return [...map.values()].sort((a, b) => String(a.student.sid).localeCompare(String(b.student.sid)));
}
function gbAgg() {
  const rows = gbRows();
  const n = rows.length, avg = f => n ? rows.reduce((a, r) => a + f(r), 0) / n : 0;
  const quizMap = new Map();
  rows.forEach(r => (r.quizzes || []).forEach(q => {
    const m = quizMap.get(q.id) || quizMap.set(q.id, { id: q.id, t: q.t, type: q.type, q: q.q, n: 0, ok: 0, tries: 0, answered: 0, texts: [], seen: 0, dist: new Map(), firstN: 0, options: q.options, key: q.key }).get(q.id);
    m.n++; if (q.firstCorrect) m.ok++; m.tries += q.attempts || 0;
    if (q.correct || q.passed) m.seen++;
    // 처음 고른 답 분포
    if (q.first != null && q.first !== '') {
      const k = Array.isArray(q.first) ? [...q.first].sort((a, b) => a - b).join(',') : q.type === 'short' ? norm(q.first) || String(q.first) : String(q.first);
      m.dist.set(k, (m.dist.get(k) || 0) + 1); m.firstN++;
      if (q.type === 'short' && !m.label) m.label = {};
      if (q.type === 'short') m.label[k] = m.label[k] || String(q.first);
    }
    if (q.type === 'essay' && q.text) { m.answered++; m.texts.push({ who: `${r.student.name}(${r.student.sid})`, text: q.text }); }
  }));
  // 30초 구간별: 다시 본 학생·반복 횟수 / "이해 안 됨" 표시
  const binOf = (map, b) => map.get(b) || map.set(b, { b, students: 0, extra: 0 }).get(b);
  const bins = new Map(), conf = new Map();
  rows.forEach(r => {
    const seen = new Set(), seenC = new Set();
    (r.visits || []).forEach((v, s) => {
      if (v < 2) return;
      const b = Math.floor(s / 30), m = binOf(bins, b);
      m.extra += v - 1;
      if (!seen.has(b)) { seen.add(b); m.students++; }
    });
    (r.confused || []).forEach(t => {
      const b = Math.floor(t / 30), m = binOf(conf, b);
      m.extra++;
      if (!seenC.has(b)) { seenC.add(b); m.students++; }
    });
  });
  const top = map => [...map.values()].sort((a, b) => b.students - a.students || b.extra - a.extra).slice(0, 6);
  const asks = rows.flatMap(r => (r.questions || []).map(x => ({ ...x, who: `${r.student.name}(${r.student.sid})` }))).sort(byT);
  return { asks, rows, n, avgScore: avg(r => r.score || 0), avgWatch: avg(r => r.watchRatio || 0), avgNotes: avg(r => (r.notes || []).length),
    lateN: rows.filter(r => r.late).length, shortN: rows.filter(r => r.watchOK === false).length, confN: rows.reduce((a, r) => a + (r.confused || []).length, 0),
    quizzes: [...quizMap.values()].sort(byT), rewatch: top(bins), conf: top(conf) };
}
// 처음 고른 답 분포: 정답은 초록, 가장 많이 고른 오답은 빨간 테두리
function distHTML(q) {
  if (!q.firstN) return '';
  const pct = c => Math.round(c / q.firstN * 100);
  let items = [];
  if (q.type === 'mcq') items = (q.options || []).map((o, j) => ({ k: String(j), label: CIRCLED[j], title: o, right: j === q.key }));
  else if (q.type === 'ox') items = ['O', 'X'].map(v => ({ k: v, label: v, right: v === q.key }));
  else if (q.type === 'multi') { const key = (q.key || []).join(','); items = [...q.dist.keys()].map(k => ({ k, label: k.split(',').filter(Boolean).map(j => CIRCLED[j]).join('') || '-', right: k === key })); }
  else if (q.type === 'short') items = [...q.dist.keys()].map(k => ({ k, label: q.label?.[k] || k, right: [q.key].map(norm).includes(k) }));
  items = items.map(x => ({ ...x, c: q.dist.get(x.k) || 0 }));
  if (q.type === 'multi' || q.type === 'short') items = items.sort((a, b) => b.c - a.c).slice(0, 4);
  const topWrong = items.filter(x => !x.right && x.c).sort((a, b) => b.c - a.c)[0];
  return `<div class="mt-1.5 flex flex-wrap gap-1" aria-label="처음 고른 답 분포">${items.map(x =>
    `<span class="dist ${x.right ? 'right' : x === topWrong ? 'top' : ''}" title="${esc(x.title || x.label)}${x.right ? ' (정답)' : ''}">${esc(String(x.label).slice(0, 14))} ${pct(x.c)}%</span>`).join('')}</div>`;
}
const gbRemark = r => [r.tampered && '⚠ 변조 의심', r.late && '지각', r.watchOK === false && `시청 미달(<${r.minWatch}%)`].filter(Boolean);

  setBusy($('gbEssayAi'), true, '요약 중…');
  try {
    const data = await aiJSON(`대학 강의 영상의 서술형 성찰 질문에 대한 학생 답변입니다. 질문마다 답변의 공통 경향 2~3가지, 자주 보이는 오해, 다음 수업에서 짚을 점을 한국어로 짧게 정리하세요. 학생 이름은 쓰지 마세요.
다른 설명 없이 JSON만 출력하세요: {"items":[{"q":"질문","summary":"정리 (줄바꿈 가능)"}]}

${essays.map((q, i) => `<질문${i + 1}>${q.q}</질문${i + 1}>\n${q.texts.map(x => `- ${x.text.slice(0, 600)}`).join('\n').slice(0, 15000)}`).join('\n\n')}`);
    const items = (data.items || []).filter(x => x && x.summary);
    if (!items.length) throw new Error('요약을 받지 못했습니다.');
    flash($('gbEssayMsg'), 'ok', items.map(x => `■ ${x.q}\n${x.summary}`).join('\n\n'));
  } catch (err) { flash($('gbEssayMsg'), 'ng', '✘ AI 요약 실패: ' + err.message); }
  finally { setBusy($('gbEssayAi'), false); }
};
$('gbSelect').onchange = () => { gbVid = $('gbSelect').value; renderGradebook(); };
$('gbClear').onclick = () => { if (!confirm('불러온 제출 파일 집계를 비울까요?')) return; gbFiles = []; $('gbNote').textContent = ''; renderGradebook(); };
$('gbCsv').onclick = () => {
  const a = gbAgg(), q = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
  const cellOf = (r, x) => { const z = (r.quizzes || []).find(y => y.id === x.id) || (r.quizzes || []).find(y => y.t === x.t && y.q === x.q);
    return !z ? '' : x.type === 'essay' ? (z.text ? '응답' : '') : z.firstCorrect ? 'O' : z.correct ? '△' : 'X'; };
  const lines = [
    ['학번', '성명', '학과', '점수', '첫 시도 정답', '채점 퀴즈 수', '시청 비율(%)', '시청 초', '노트 수', '이해 안 됨', '제출 시각', '비고', ...a.quizzes.map((x, i) => `Q${i + 1}(${fmt(x.t)})`)].map(q).join(','),
    ...a.rows.map(r => [r.student.sid, r.student.name, r.student.dept, r.score, r.correctFirst, r.total, Math.round((r.watchRatio || 0) * 100), r.watchedSec, (r.notes || []).length,
      (r.confused || []).length, localTime(r.submittedAt), gbRemark(r).join(' · ').replace('⚠ ', ''), ...a.quizzes.map(x => cellOf(r, x))].map(q).join(',')),
    '', ['퀴즈 시간', '유형', '문항', '정답률(%)', '평균 시도'].map(q).join(','),
    ...a.quizzes.map(x => [fmt(x.t), TYPES[x.type], x.q, x.type === 'essay' ? `응답 ${x.answered}/${x.n}` : x.n ? Math.round(x.ok / x.n * 100) : 0, x.n && x.type !== 'essay' ? (x.tries / x.n).toFixed(1) : ''].map(q).join(',')),
    '', ['다시 본 구간', '다시 본 학생 수', '반복 횟수'].map(q).join(','),
    ...a.rewatch.map(b => [`${fmt(b.b * 30)}-${fmt(b.b * 30 + 30)}`, b.students, b.extra].map(q).join(',')),
    '', ['질문 시각', '학생', '질문'].map(q).join(','),
    ...a.asks.map(x => [fmt(x.t), x.who, x.text].map(q).join(',')),
    '', ['이해 안 됨 구간', '표시한 학생 수', '표시 수'].map(q).join(','),
    ...a.conf.map(b => [`${fmt(b.b * 30)}-${fmt(b.b * 30 + 30)}`, b.students, b.extra].map(q).join(',')),
    ...a.quizzes.filter(x => x.type === 'essay').flatMap(x => ['', [`서술형 ${fmt(x.t)}`, x.q].map(q).join(','), ...x.texts.map(t => [t.who, t.text].map(q).join(','))])
  ];
  download('﻿' + lines.join('\r\n'), `집계_${safeName(a.rows[0]?.title)}`, 'csv', 'text/csv');
};

// ---------- 전체 그리기 ----------
function renderTitle() {
  $('titleInput').value = rec.title || '';
  $('titleInput').placeholder = '영상 제목';
  $('srcLabel').textContent = rec.src.kind === 'yt' ? `YOUTUBE · ${rec.src.id}` : rec.src.kind === 'url' ? 'VIDEO URL' : `FILE · ${rec.src.name}`;
  document.title = STUDENT ? `${rec.title || '학습 영상'} · 학생용 | ${APP_NAME}` : APP_NAME;
}
function renderAll() {
  renderTitle();
  $('blockSkip').checked = rec.blockSkip;
  setMode(mode);
  renderBar(); renderNotes(); renderCues(); renderEditor(); renderBooks(); renderSubInfo(); renderLoop(); renderStamp(); renderHistory(); renderDeploy(); renderStu();
  $('saveState').textContent = '';
}

// ---------- 시작 ----------
selectProvider(provider);
document.querySelector(`input[name=provider][value=${provider}]`).checked = true;
updateBadge(); renderSummaries(); renderCourseLine(); showCourseSaved(false);
$('appUrl').value = appUrl;
$('appUrl').placeholder = pageAppUrl() || '예: https://아이디.github.io/cliplab/';
(async () => {
  if (STUDENT) {
    ['aiSec', 'sourceSec', 'setup', 'gradebook', 'modeTabs', 'aiSummary'].forEach(id => $(id).classList.add('hidden'));
    $('stuBadge').classList.remove('hidden');
    $('stuCard').classList.remove('hidden');
    if (STUDENT.pending) {
      // 온라인 공유 링크: 링크 속 데이터 풀기
      try {
        const d = await unpackShare(SHARE_CODE);
        if (d?.app !== 'cliplab-student' || !d.record) throw new Error('형식');
        STUDENT = d;
        Object.assign(course, d.course || {});
        renderCourseLine();
      } catch {
        return showPlayerMsg('<b>⚠ 공유 링크를 열 수 없습니다.</b><span>링크가 잘렸거나 손상되었습니다. 링크 전체를 다시 받아 열어 주세요.</span>');
      }
    }
    openRecord(STUDENT.record);
    if (!prog.student) openStuModal();
  } else {
    let done;
    historyReady = new Promise(r => done = r);
    if (!await checkPersist()) {
      $('histWarn').innerHTML = `⚠ 지금 화면은 <b>브라우저 저장이 막혀</b>(앱 미리보기 창·data: 주소·일부 시크릿 창 등) 히스토리·퀴즈·노트가 <b>새로고침하면 사라집니다</b>.
        index.html을 <b>크롬·엣지에서 직접</b> 열거나 웹 주소(https://…)로 여세요. 지금 작업은 <b>💾 전체 백업</b>으로 파일에 보관했다가 <b>백업 복원</b>으로 되살릴 수 있습니다.`;
      $('histWarn').classList.remove('hidden');
      setCollapsed('hist', false);
    }
    history = await bigStore.get(HIST_KEY, []);
    if (!Array.isArray(history)) history = [];
    done();
    const last = lastVid && await bigStore.get('cliplab-video:' + lastVid);
    openRecord(last || sampleRecord());
  }
})();
</script>
